services:
  redis:
    image: redis:7-alpine
    container_name: mf-nav-redis
    restart: unless-stopped
    command: redis-server --maxmemory 32mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    ports:
      - "3279:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 48M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  mf-nav:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mf-nav-tracker
    restart: unless-stopped
    mem_limit: 250m
    deploy:
      resources:
        limits:
          memory: 250M
    depends_on:
      - redis
    ports:
      - "3200:3200"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3200
      - HOSTNAME=0.0.0.0
      - TIMEZONE=Asia/Kolkata
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3200/api/portfolio || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:
