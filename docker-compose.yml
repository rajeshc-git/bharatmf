services:
  mf-nav:
    image: ghcr.io/rajeshc-git/bharatmf:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mf-nav-tracker
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 50M
    mem_limit: 50m
    ports:
      - "3200:3200"
    environment:
      - NODE_ENV=production
      - PORT=3200
      - HOSTNAME=0.0.0.0
      - TIMEZONE=Asia/Kolkata
      - NODE_OPTIONS=--max-old-space-size=40
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:3200/api/portfolio').then(r => process.exit(r.status < 500 ? 0 : 1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

